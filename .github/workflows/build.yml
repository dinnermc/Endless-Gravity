name: Build and Test (Fabric)

on:
  push:
    branches: [fabric-1.21.1]
  pull_request:
    branches: [fabric-1.21.1]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run tests and build JAR
        run: |
          chmod +x gradlew
          ./gradlew test remapJar sourcesJar javadocJar --no-daemon

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: endless-gravity-fabric
          path: build/libs/*.jar
