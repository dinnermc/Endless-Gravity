name: Publish to Modrinth

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin

      - run: chmod +x gradlew

      - name: Check if version already published
        id: check
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: |
          VER="${GITHUB_REF_NAME#v}"
          VID=$(curl -fsS -H "Authorization: Bearer $MODRINTH_TOKEN" \
            "https://api.modrinth.com/v2/project/endless-gravity/version" \
            | jq -r --arg v "$VER" '.[] | select(.version_number == $v) | .id' | head -n1)
          if [ -n "$VID" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload to Modrinth
        if: steps.check.outputs.exists == 'false'
        run: ./gradlew build modrinth
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}

      - name: Update Modrinth version changelog
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: |
          VER="${GITHUB_REF_NAME#v}"
          VID=$(curl -fsS -H "Authorization: Bearer $MODRINTH_TOKEN" \
            "https://api.modrinth.com/v2/project/endless-gravity/version" \
            | jq -r --arg v "$VER" '.[] | select(.version_number == $v) | .id' | head -n1)
          if [ -z "$VID" ]; then
            echo "::error::Version $VER not found on Modrinth"
            exit 1
          fi
          CHANGELOG=$(awk -v v="$VER" '/^## /{ if (f) exit; if ($2 == v) f=1 } f{ print }' CHANGELOG.md)
          jq -n --arg changelog "$CHANGELOG" '{changelog: $changelog}' \
            | curl -fsS -X PATCH -H "Authorization: Bearer $MODRINTH_TOKEN" \
              -H "Content-Type: application/json" -d @- \
              "https://api.modrinth.com/v2/version/$VID"

      - name: Repair changelog of v1.1.0 (one-time)
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: |
          VER="1.1.0"
          VID=$(curl -fsS -H "Authorization: Bearer $MODRINTH_TOKEN" \
            "https://api.modrinth.com/v2/project/endless-gravity/version" \
            | jq -r --arg v "$VER" '.[] | select(.version_number == $v) | .id' | head -n1)
          if [ -z "$VID" ]; then exit 0; fi
          CHANGELOG=$(awk -v v="$VER" '/^## /{ if (f) exit; if ($2 == v) f=1 } f{ print }' CHANGELOG.md)
          jq -n --arg changelog "$CHANGELOG" '{changelog: $changelog}' \
            | curl -fsS -X PATCH -H "Authorization: Bearer $MODRINTH_TOKEN" \
              -H "Content-Type: application/json" -d @- \
              "https://api.modrinth.com/v2/version/$VID"

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NOTES="See [Modrinth](https://modrinth.com/project/endless-gravity/version/$GITHUB_REF_NAME) for changelog."
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --title "Endless Gravity v$VERSION" --notes "$NOTES"
          else
            gh release create "$GITHUB_REF_NAME" --title "Endless Gravity v$VERSION" --notes "$NOTES"
          fi
          JAR="build/libs/endless_gravity-${VERSION}.jar"
          if [ -f "$JAR" ]; then
            gh release upload "$GITHUB_REF_NAME" "$JAR" --clobber
          fi