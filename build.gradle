plugins {
    id 'fabric-loom' version '1.10.5'
    id 'com.modrinth.minotaur' version '2.+'
}

version = project.mod_version
group = project.mod_group_id

base {
    archivesName = project.archives_base_name
}

repositories {
    maven { url = "https://maven.shedaniel.me/" }
    maven { url = "https://maven.terraformersmc.com/releases/" }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    modApi("me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}") {
        exclude(group: "net.fabricmc.fabric-api")
    }
    modImplementation "com.terraformersmc:modmenu:${project.modmenu_version}"

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

tasks.named('test') {
    useJUnitPlatform()
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs << "--enable-preview"
}

modrinth {
    token = System.getenv("MODRINTH_TOKEN")
    projectId = "endless-gravity"
    versionNumber = mod_version
    versionType = "release"
    uploadFile = remapJar
    gameVersions = ["1.21.1"]
    loaders = ["fabric"]
    def changelogText = rootProject.file("CHANGELOG.md").text
    def sectionStart = changelogText.indexOf("\n## ")
    def sectionEnd = changelogText.indexOf("\n## ", sectionStart + 1)
    changelog = sectionStart == -1 ? changelogText : changelogText.substring(sectionStart + 1, sectionEnd == -1 ? changelogText.length() : sectionEnd).trim()
}

tasks.register('publishToModrinth') {
    group = 'publishing'
    description = 'Publish to Modrinth via Minotaur'
    dependsOn 'modrinth'
}
