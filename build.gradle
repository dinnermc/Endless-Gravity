plugins {
    id 'java-library'
    id 'maven-publish'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.142'
    id 'com.modrinth.minotaur' version '2.+'
}

version = mod_version
group = mod_group_id

repositories {
    mavenLocal()
    maven { url = "https://maven.neoforged.net/releases" }
    maven { url = "https://maven.ryanhcode.dev/releases" }
    maven { url = "https://maven.blamejared.com" }
    maven { url = "https://maven.createmod.net" }
    maven { url = "https://maven.ithundxr.dev/snapshots" }
    maven { url = "https://maven.shedaniel.me" }
    exclusiveContent {
        forRepository {
            maven {
                url = "https://maven.ryanhcode.dev/releases"
                name = "RyanHCode Maven"
            }
        }
        filter {
            includeGroup("dev.ryanhcode.sable-companion")
            includeGroup("dev.ryanhcode.sable")
        }
    }
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

sourceSets {
    client
}

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
            sourceSet(sourceSets.client)
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

sourceSets.client.compileClasspath += sourceSets.main.output
sourceSets.client.compileClasspath += sourceSets.main.compileClasspath
sourceSets.client.runtimeClasspath += sourceSets.main.output
sourceSets.client.runtimeClasspath += sourceSets.main.runtimeClasspath

dependencies {
    compileOnly "dev.ryanhcode.sable:sable-neoforge-${minecraft_version}:${sable_version}"
    jarJar(api("dev.ryanhcode.sable-companion:sable-companion-common-${minecraft_version}:${sable_companion_version}")) {
        version {
            strictly "[${sable_companion_version},)"
            prefer sable_companion_version
        }
    }
    jarJar(api("me.shedaniel.cloth:cloth-config-neoforge:${cloth_config_version}")) {
        version {
            strictly "[${cloth_config_version},)"
            prefer cloth_config_version
        }
    }
}

jar {
    from sourceSets.client.output
}

tasks.named('jar') {
    dependsOn 'compileClientJava'
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [minecraft_version      : minecraft_version,
                             minecraft_version_range: minecraft_version_range,
                             neo_version            : neo_version,
                             neo_version_range      : neo_version_range,
                             loader_version_range   : loader_version_range,
                             mod_id                 : mod_id,
                             mod_name               : mod_name,
                             mod_license            : mod_license,
                             mod_version            : mod_version,
                             mod_authors            : mod_authors,
                             mod_description        : mod_description,
                             cloth_config_version   : cloth_config_version]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
}

modrinth {
    token = System.getenv("MODRINTH_TOKEN")
    projectId = "endless-gravity"
    versionNumber = mod_version
    versionType = "release"
    uploadFile = jar
    gameVersions = ["1.21.1"]
    loaders = ["neoforge"]
    def changelogText = rootProject.file("CHANGELOG.md").text
    changelog = changelogText.substring(0, changelogText.indexOf("\n## ", 3)).trim()
    syncBodyFrom = rootProject.file("README.md").text
}

tasks.register('publishToModrinth') {
    group = 'publishing'
    description = 'Publish to Modrinth via Minotaur'
    dependsOn 'modrinth'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
